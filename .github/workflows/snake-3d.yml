name: 3D Snake Contributions

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 한국시간 새벽 3시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate 3D snake graph
        run: node scripts/snake-3d.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-snake
          if git commit -m "update 3d snake graph"; then
            git push
          fi
